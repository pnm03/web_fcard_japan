<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo Stealth Widget</title>
  <style>
    :root {
      --bg-glass: rgba(15, 20, 32, 0.92);
      --border-glass: rgba(255, 255, 255, 0.14);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.18);
      --radius-pill: 26px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .widget-root {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 4px;
      width: 100%;
      height: 100%;
    }

    /* Viên thuốc chính (Pill Capsule) */
    .widget-capsule {
      height: 50px;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      padding: 0 8px 0 4px;
      gap: 6px;
      position: relative;
      flex-shrink: 0;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .widget-capsule.correct {
      border-color: var(--success);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
      background: rgba(14, 34, 22, 0.95);
    }

    .widget-capsule.wrong {
      border-color: var(--error);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
      background: rgba(34, 14, 18, 0.95);
    }

    /* Tay nắm kéo di chuyển */
    .drag-handle {
      -webkit-app-region: drag;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      padding: 0 6px;
      font-size: 14px;
      letter-spacing: -2px;
      opacity: 0.45;
      height: 100%;
      flex-shrink: 0;
      transition: opacity 0.2s, color 0.2s;
    }
    .drag-handle:hover {
      opacity: 1;
      color: var(--accent);
    }

    /* Phần 1: Hiển thị chữ tiếng Nhật / Nghĩa */
    .word-section {
      display: flex;
      align-items: center;
      gap: 5px;
      flex: 1 1 auto;
      min-width: 0;
      cursor: default;
    }

    .word-text {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }

    .word-sub {
      font-size: 11px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.85;
      font-family: monospace;
    }

    .speak-btn {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 6px;
      opacity: 0.6;
      transition: opacity 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .speak-btn:hover {
      opacity: 1;
      color: var(--accent);
    }

    /* Phần 2: Ô nhập đáp án */
    .input-section {
      -webkit-app-region: no-drag;
      flex: 1 1 135px;
      min-width: 115px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .answer-input {
      width: 100%;
      height: 32px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 13px;
      padding: 0 24px 0 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      user-select: text;
    }
    .answer-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.12);
    }
    .answer-input::placeholder {
      color: var(--text-sub);
      opacity: 0.6;
      font-size: 11.5px;
    }

    .enter-badge {
      position: absolute;
      right: 8px;
      font-size: 11px;
      color: var(--text-sub);
      opacity: 0.5;
      pointer-events: none;
    }

    /* Gợi ý đáp án khi làm sai - Hiển thị trực tiếp đè lên ô nhập, mắt nhìn thấy ngay lập tức */
    .answer-hint-overlay {
      position: absolute;
      inset: 0;
      background: rgba(220, 38, 38, 0.95);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-radius: 16px;
      z-index: 10;
      white-space: nowrap;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .answer-hint-overlay.show {
      display: flex;
    }
    .hint-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint-enter-icon {
      font-size: 10px;
      opacity: 0.8;
      flex-shrink: 0;
      margin-left: 4px;
    }

    /* Nút cài đặt và ẩn */
    .control-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      opacity: 0.6;
      transition: all 0.15s;
    }
    .btn-icon:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }
    .btn-close:hover {
      background: rgba(239, 68, 68, 0.25);
      color: var(--error);
    }

    /* Panel cài đặt mở rộng (Settings Panel) */
    .settings-panel {
      -webkit-app-region: no-drag;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: fadeIn 0.15s ease-out;
    }
    .settings-panel.open {
      display: flex;
    }

    .pop-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .pop-label {
      font-size: 10.5px;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .pop-select {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 12px;
      border-radius: 6px;
      padding: 4px 6px;
      outline: none;
    }
    .pop-select option {
      background: #1e2230;
      color: #fff;
    }

    .opacity-buttons {
      display: flex;
      gap: 4px;
    }
    .btn-chip {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-sub);
      font-size: 11px;
      padding: 3px 0;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .btn-chip:hover, .btn-chip.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="widget-root">
    <!-- VIÊN THUỐC CHÍNH (ALWAYS VISIBLE) -->
    <div class="widget-capsule" id="widget-box">
      <!-- Nút kéo di chuyển -->
      <div class="drag-handle" title="Kéo để di chuyển widget">⋮⋮</div>

      <!-- PHẦN 1: HIỂN THỊ TỪ CẦN ÔN -->
      <div class="word-section" id="word-section">
        <span class="word-text" id="display-word">たかい</span>
        <span class="word-sub" id="display-sub">takai</span>
        <button class="speak-btn" id="speak-btn" title="Phát âm (Tab)">🔊</button>
      </div>

      <!-- PHẦN 2: Ô NHẬP ĐÁP ÁN -->
      <div class="input-section">
        <input 
          type="text" 
          class="answer-input" 
          id="answer-input" 
          placeholder="Đáp án... ↵" 
          autocomplete="off" 
          spellcheck="false"
        />
        <span class="enter-badge">↵</span>

        <!-- Hint nổi trực tiếp trên ô nhập khi làm sai -->
        <div class="answer-hint-overlay" id="answer-hint-overlay">
          <span class="hint-text" id="hint-text">Đ/Á: cao, đắt</span>
          <span class="hint-enter-icon">↵ Tiếp</span>
        </div>
      </div>

      <!-- NÚT ĐIỀU KHIỂN -->
      <div class="control-actions">
        <button class="btn-icon" id="settings-toggle-btn" title="Cài đặt">⚙</button>
        <button class="btn-icon btn-close" id="close-btn" title="Ẩn nhanh (Esc)">✕</button>
      </div>
    </div>

    <!-- PANEL CÀI ĐẶT MỞ RỘNG (HIỂN THỊ KHI BẤM ⚙) -->
    <div class="settings-panel" id="settings-panel">
      <div class="pop-row">
        <span class="pop-label">Chế độ luyện tập</span>
        <select class="pop-select" id="mode-select">
          <option value="jp_to_meaning">Nhật ➔ Nghĩa Tiếng Việt</option>
          <option value="jp_to_romaji">Nhật ➔ Romaji</option>
          <option value="meaning_to_romaji">Nghĩa ➔ Romaji</option>
        </select>
      </div>

      <div class="pop-row">
        <span class="pop-label">Bộ từ vựng</span>
        <select class="pop-select" id="project-select">
          <option value="all">Tất cả từ vựng</option>
          <option value="weak">Từ hay sai / Cần ôn tập</option>
        </select>
      </div>

      <div class="pop-row">
        <span class="pop-label">Độ tàng hình văn phòng</span>
        <div class="opacity-buttons">
          <button class="btn-chip" data-opacity="100">100%</button>
          <button class="btn-chip active" data-opacity="90">90%</button>
          <button class="btn-chip" data-opacity="65">65%</button>
          <button class="btn-chip" data-opacity="45">45%</button>
        </div>
      </div>

      <div class="bottom-bar">
        <span style="font-size: 11px; color: var(--text-sub);">Tab: Đọc | Esc: Ẩn</span>
        <button class="btn-chip" id="open-full-app-btn" style="flex: 0 0 auto; padding: 3px 10px;">Mở Bảng Học</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/widget.js"></script>
</body>
</html>
