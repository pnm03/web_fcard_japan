<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="miwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="miwSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="miwPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="miwBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bo góc chuẩn App Icon (Squircle) -->
  <rect width="64" height="64" rx="15" fill="url(#miwBg)"/>
  
  <!-- Viền kim loại mỏng tinh tế -->
  <rect width="62" height="62" x="1" y="1" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>

  <!-- Mặt trời đỏ Nhật Bản (Hinomaru) với hiệu ứng glow -->
  <circle cx="32" cy="25" r="14" fill="url(#miwSun)" filter="url(#glow)"/>

  <!-- Núi Phú Sĩ cách điệu thành chữ M (MIW) - Thân núi -->
  <path d="M 10 50 L 22 23 L 32 37 L 42 23 L 54 50 Z" fill="url(#miwBase)"/>

  <!-- Đỉnh tuyết trắng chữ M (Snowcap) cực kỳ nổi bật khi thu nhỏ -->
  <path d="M 18 33 L 22 23 L 26 33 L 24 35 L 22 33 L 20 35 Z" fill="url(#miwPeak)"/>
  <path d="M 38 33 L 42 23 L 46 33 L 44 35 L 42 33 L 40 35 Z" fill="url(#miwPeak)"/>
  <path d="M 28 32 L 32 37 L 36 32 L 34 30 L 32 32 L 30 30 Z" fill="#ffffff"/>

  <!-- Thẻ Flashcard góc bo tối giản ở đế -->
  <rect x="23" y="44" width="18" height="3" rx="1.5" fill="#f43f5e"/>
</svg>
