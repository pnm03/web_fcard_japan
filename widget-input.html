<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo Input Box</title>
  <style>
    :root {
      --bg-glass: rgba(15, 20, 32, 0.94);
      --border-glass: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
      --error: #ef4444;
      --input-bg: rgba(255, 255, 255, 0.08);
      --input-border: rgba(255, 255, 255, 0.18);
      --radius-pill: 26px;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      background: transparent;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }
    .input-capsule {
      width: 100%;
      height: 100%;
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-pill);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      padding: 0 8px 0 6px;
      gap: 6px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-capsule.correct {
      border-color: var(--success);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
      background: rgba(14, 34, 22, 0.95);
    }
    .input-capsule.retry {
      border-color: #f59e0b;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.45);
      background: rgba(40, 28, 10, 0.95);
      animation: shakeInput 0.35s ease-in-out;
    }
    .input-capsule.wrong {
      border-color: var(--error);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
      background: rgba(34, 14, 18, 0.95);
    }
    @keyframes shakeInput {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .drag-handle {
      -webkit-app-region: drag;
      cursor: grab;
      color: var(--text-sub);
      font-size: 13px;
      letter-spacing: -2px;
      opacity: 0.5;
      padding: 0 2px;
      height: 100%;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: opacity 0.2s, color 0.2s;
    }
    .drag-handle:hover {
      opacity: 1;
      color: var(--accent);
    }
    .drag-handle:active {
      cursor: grabbing;
    }
    .input-wrapper {
      -webkit-app-region: no-drag;
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
    }
    .answer-input {
      width: 100%;
      height: 32px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 13px;
      padding: 0 46px 0 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      user-select: text;
    }
    .answer-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.12);
    }
    .answer-input::placeholder {
      color: var(--text-sub);
      opacity: 0.6;
      font-size: 11.5px;
    }
    .widget-ime-badge {
      position: absolute;
      right: 20px;
      width: 20px;
      height: 20px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.45);
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 5;
      padding: 0;
      line-height: 1;
    }
    .widget-ime-badge:hover {
      filter: brightness(1.25);
      transform: scale(1.08);
    }
    .widget-ime-badge.mode-vietnamese {
      border-color: rgba(168, 85, 247, 0.4);
      background: rgba(168, 85, 247, 0.15);
      color: #c084fc;
      font-size: 9px;
    }
    .widget-ime-badge.mode-romaji {
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      font-size: 9px;
    }
    .widget-ime-badge.mode-raw {
      border-color: rgba(148, 163, 184, 0.35);
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      font-size: 10px;
    }
    .enter-badge {
      position: absolute;
      right: 6px;
      font-size: 11px;
      color: var(--text-sub);
      opacity: 0.5;
      pointer-events: none;
    }
    /* Gợi ý đáp án khi làm sai */
    .answer-hint-overlay {
      position: absolute;
      inset: 0;
      background: rgba(220, 38, 38, 0.95);
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-radius: 16px;
      z-index: 10;
      white-space: nowrap;
      overflow: hidden;
      animation: fadeIn 0.15s ease-out;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .answer-hint-overlay.show {
      display: flex;
    }
    .hint-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .hint-enter-icon {
      font-size: 10px;
      opacity: 0.8;
      flex-shrink: 0;
      margin-left: 4px;
    }
    .btn-close {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      opacity: 0.6;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .btn-close:hover {
      opacity: 1;
      background: rgba(239, 68, 68, 0.25);
      color: var(--error);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="input-capsule" id="input-box">
    <div class="drag-handle" title="Kéo để di chuyển ô nhập">⋮⋮</div>
    <div class="input-wrapper">
      <input 
        type="text" 
        class="answer-input" 
        id="answer-input" 
        placeholder="Đáp án... ↵" 
        autocomplete="off" 
        spellcheck="false"
      />
      <button type="button" class="widget-ime-badge mode-kana" id="widget-ime-badge" title="Bộ gõ tự động: Nhấp hoặc ấn F2 để đổi (Kana / Bàn phím thường)">あ</button>
      <span class="enter-badge">↵</span>

      <div class="answer-hint-overlay" id="answer-hint-overlay">
        <span class="hint-text" id="hint-text">Đ/Á: ...</span>
        <span class="hint-enter-icon">↵ Tiếp</span>
      </div>
    </div>
    <button class="btn-close" id="close-btn" title="Dừng & Về App (Esc)">✕</button>
  </div>

  <script type="module" src="/src/widget-input.js"></script>
</body>
</html>
